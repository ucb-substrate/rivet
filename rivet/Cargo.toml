[package]
name = "rivet"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8.12"
indoc = "2"
rust_decimal = "1"
rust_decimal_macros = "1"
by_address = "1.2.1"
# The live display: an inline viewport at the bottom of the ordinary terminal,
# with finished steps pushed above it into the scrollback. `crossterm` comes
# with it, and is used through `ratatui::crossterm` so there is only ever one.
ratatui = "0.29"
tracing = "0.1"
# No `ansi`: these layers write to files, never to a terminal. `tracing-log`
# catches anything a dependency logs through the `log` crate, which would
# otherwise land on stderr and corrupt the display.
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "fmt",
    "std",
    "env-filter",
    "tracing-log",
] }
tracing-appender = "0.2"

# Both already come with `ratatui`'s crossterm, so neither adds a crate to the
# build. `rustix` puts back the signal keys that raw mode turns off, and
# `signal-hook` catches the interrupt so the terminal can be handed back before
# the run ends. See `src/tui.rs`.
[target.'cfg(unix)'.dependencies]
rustix = { version = "0.38", features = ["termios"] }
signal-hook = "0.3"

